<title>Angebot RC-2026-002 · RITMO Consulting</title>
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;
  src:url(../angebot-fonts/inter-400.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;
  src:url(../angebot-fonts/inter-500.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;
  src:url(../angebot-fonts/inter-600.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:700;font-display:swap;
  src:url(../angebot-fonts/inter-700.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:italic;font-weight:400;font-display:swap;
  src:url(../angebot-fonts/inter-400-italic.woff2) format('woff2')}

:root{--ground:#fff;--ink:#111114;--muted:#6e6e76;--line:#e3e3e7;--accent:#ff7a1a;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Inter Tight',Inter,system-ui,'Segoe UI',Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--ground:#0b0b0d;--ink:#f5f5f7;--muted:#93939c;--line:#26262b}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:32px 22px;background:var(--ground);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased}
.box{width:100%;max-width:380px;text-align:center}
img.mark{width:158px;height:auto;display:block;margin:0 auto 34px;
  filter:invert(1) brightness(.06)}
@media (prefers-color-scheme:dark){img.mark{filter:none}}
h1{margin:0 0 6px;font-size:21px;letter-spacing:-.02em;font-weight:600}
.nr{margin:0 0 30px;font-size:13px;color:var(--muted);letter-spacing:.02em;
  font-variant-numeric:tabular-nums}
form{display:flex;flex-direction:column;gap:10px}
input{width:100%;height:46px;padding:0 14px;border:1px solid var(--line);border-radius:11px;
  background:transparent;color:var(--ink);font:inherit;font-size:16px;text-align:center;
  letter-spacing:.06em;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,122,26,.16)}
button{height:46px;border:0;border-radius:11px;background:var(--accent);color:#fff;
  font:inherit;font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.err{min-height:18px;margin:2px 0 0;font-size:13px;color:#e0322a}
.gueltig{margin:26px 0 0;padding-top:18px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--muted)}
.abs{margin:8px 0 0;font-size:12px;color:var(--muted)}
noscript{display:block;margin-top:18px;font-size:13px;color:var(--muted)}
</style>
