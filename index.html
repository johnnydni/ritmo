<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RITMO" />
    <meta name="theme-color" id="theme-color-meta" content="#000000" />
    <meta name="format-detection" content="telephone=no" />
    <!--
      Content-Security-Policy — Defense-in-depth gegen XSS. GitHub
      Pages erlaubt keine HTTP-Header, deshalb als <meta>. Wichtige
      Hosts:
        - Supabase REST + Realtime (HTTPS + WebSocket)
        - api.qrserver.com für QR-Code-Generierung im Online-Turnier
        - images.pexels.com / images.unsplash.com / videos.pexels.com
          → Ambient-Assets für das "Bauhaus Funky"-Theme (Stock-Bilder
          und -Videos). Andere Themes laden NICHTS extern.
        - data: + blob: für Image-Previews + Worker-Bundles
      'unsafe-inline' bei style-src ist nötig, weil React Inline-Styles
      benutzt. 'unsafe-eval' wird bewusst NICHT erlaubt.
      'wasm-unsafe-eval' erlaubt ausschliesslich das Kompilieren von
      WebAssembly (die On-Device-Texterkennung fuer den Spieler-Scan
      laeuft als WASM-Modul) — im Gegensatz zu 'unsafe-eval' bleibt
      eval() fuer JavaScript weiterhin gesperrt.
    -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'wasm-unsafe-eval';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: blob: https://api.qrserver.com https://images.pexels.com https://images.unsplash.com;
               media-src 'self' blob: https://videos.pexels.com https://*.pexels.com;
               font-src 'self' data:;
               connect-src 'self' https://*.supabase.co wss://*.supabase.co https://videos.pexels.com https://*.pexels.com;
               worker-src 'self' blob:;
               object-src 'none';
               base-uri 'self';
               form-action 'self'" />
    <!-- frame-ancestors ist per <meta> wirkungslos (nur als HTTP-Header
         möglich) und erzeugte nur einen Konsolen-Fehler — entfernt. -->

    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- iOS unterstützt KEIN SVG als Touch-Icon — PNG nötig, sonst
         fällt die Home-Screen-Installation auf Defaults zurück.
         Und: iOS kennt für Home-Screen-Icons keine Transparenz und
         legt alles auf WEISS. Das Logo ist weiß auf transparent —
         auf dem Home-Screen blieb deshalb eine fast leere weiße
         Kachel übrig. Die icon-*.png tragen Schwarz als Fläche
         (RGB ohne Alphakanal), gebaut von tools/make-icons.py. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icon-180.png" />
    <!-- Web App Manifest: neuere iOS-Versionen richten die installierte
         Home-Screen-App hieran aus (display/theme/background) — ohne
         Manifest boxt iOS die App teils mit schwarzen Balken ein. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>RITMO Padel</title>
    <style>
      /* WICHTIG: kein 100dvh und kein -webkit-overflow-scrolling hier.
         - 100dvh klemmt in iOS-Home-Screen-Apps die untere Safe-Area ab
           → html/body/#root endeten oberhalb der Screen-Unterkante und
           ALLES (auch position:fixed-Overlays wie der Splash) wurde an
           dieser verkuerzten Box geclippt → schwarzer Balken unten.
         - -webkit-overflow-scrolling:touch machte body zum Composited-
           Scroll-Kontext, der fixed-Elemente wie geclippte absolute
           behandelt. 100% = echter Viewport inkl. Safe-Areas
           (viewport-fit=cover). */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: #000;
        overscroll-behavior: none;
        overflow: hidden;
      }
      #root {
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
